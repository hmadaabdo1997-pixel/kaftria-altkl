<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#24170f">
<title>كافتريا التكل | قائمة الطعام</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f4ead8;color:#2b1b12;font-family:Tahoma,"Segoe UI",Arial,sans-serif}
.hero{background:linear-gradient(135deg,#160d08,#4a2b15 55%,#1b100b);color:#fff;padding:34px 18px 28px;text-align:center;border-bottom:4px solid #c99a42}
.hero h1{margin:0;font-size:clamp(34px,7vw,64px);color:#e7c16b;text-shadow:0 3px 12px #000;font-weight:900}
.hero p{margin:8px 0 0;color:#f7ead1;font-size:18px}
.wrap{max-width:1100px;margin:auto;padding:24px 14px 50px}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
button{border:1px solid #b78736;background:#fff7e9;color:#4a2b15;padding:12px 18px;border-radius:999px;font-weight:800;cursor:pointer}
button.active,button:hover{background:#4a2b15;color:#fff}
.card{display:none;background:#fffaf1;border:1px solid #d8bd8b;border-radius:22px;padding:12px;box-shadow:0 12px 35px #3b241520}
.card.active{display:block}
.card img{display:block;width:100%;height:auto;border-radius:15px}
.note{text-align:center;margin-top:18px;color:#73583d;font-size:15px}
.cta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
a.cta-btn{text-decoration:none;background:#4a2b15;color:#fff;padding:13px 20px;border-radius:999px;font-weight:800}
footer{text-align:center;padding:20px;color:#8a6a45;font-size:14px}
</style>
</head>
<body>
<header class="hero">
<h1>كافتريا التكل</h1>
<p>قائمة الطعام • اطلب ما تحب بسهولة</p>
</header>
<main class="wrap">
<nav class="tabs" aria-label="أقسام القائمة">
<button class="active" onclick="showCard('main',this)">القائمة الرئيسية</button>
<button onclick="showCard('pizza',this)">البيتزا والفطائر</button>
</nav>
<section id="main" class="card active">
<img src="menu-main.png" alt="قائمة الطعام الرئيسية - كافتريا التكل">
</section>
<section id="pizza" class="card">
<img src="menu-pizza.png" alt="البيتزا والفطائر - كافتريا التكل">
</section>
<p class="note">لأفضل وضوح على الهاتف، اضغط على الصورة لفتحها بحجم كامل.</p>
<div class="cta">
<a class="cta-btn" href="menu-main.png" target="_blank">فتح القائمة الرئيسية</a>
<a class="cta-btn" href="menu-pizza.png" target="_blank">فتح البيتزا والفطائر</a>
</div>
</main>
<footer>أهلاً بكم في كافتريا التكل — نسعد بخدمتكم دائماً</footer>
<script>
function showCard(id,btn){
 document.querySelectorAll('.card').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active'); btn.classList.add('active');
}
</script>
</body>
</html>
